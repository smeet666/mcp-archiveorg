# Nightly canary against the real the Internet Archive API.
#
# The unit tests run against generated JSON fixtures, so they cannot detect that
# the Internet Archive renamed a field or changed a status code: the day it does, they stay
# green while the published server is broken for everyone. This job is the only
# thing that notices, and it opens an issue when it fails.
#
# It is deliberately separate from CI: it depends on a third-party service, so a
# failure here means "the API moved", never "this pull request is bad".
#
# An Archive that did not answer at all is not a contract that moved, and the
# suite declares those assertions inconclusive rather than failing them. A run
# whose tests are mostly skipped is a bad night at the Archive; a run that fails
# is a route that changed.

name: Live canary

on:
  schedule:
    # 01:53 UTC, off the hour and clear of the other scheduled jobs.
    - cron: "53 1 * * *"
  workflow_dispatch:

# A single run at a time, so a slow night cannot overlap with the next one.
concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open the issue that reports a broken contract.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the live canary
        env:
          IA_LIVE: "1"
          # Slower than the default: a scheduled job has no user waiting, and
          # the Internet Archive is a free service.
          IA_MIN_INTERVAL_MS: "2000"
          # Generous: a canary must fail on a changed contract, not on a slow night.
          IA_TIMEOUT_MS: "60000"
          # More attempts than a caller would wait through. The services behind
          # the full-text search fail for a minute at a time, and a canary that
          # gives up as fast as an interactive tool reports those as breakage.
          IA_MAX_RETRIES: "5"
          IA_LOG_LEVEL: info
        run: npm run test:live

      - name: Close the report when the routes answer again
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            // An open report says the routes are failing. Left open after they
            // answer again, it says that of a night that has passed, and the
            // next failure lands as a comment on a thread nobody reopens.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The routes answered again as of ${new Date().toISOString()}. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Report a broken canary
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Live canary failing: the the Internet Archive API may have changed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly live canary failed. Either the Internet Archive changed a route this",
              "server reads, or it was unreachable from the runner.",
              "",
              `Run: ${runUrl}`,
              "",
              "The assertion messages name the field or the behaviour that moved. Fixing one means",
              "editing `src/ia/parse.ts` or `src/ia/paths.ts`, regenerating the fixtures so the unit",
              "tests cover the new shape, and releasing a patch version.",
              "",
              "None of these routes is documented: they are the ones the Archive's own pages call, so",
              "any of them can change without notice and the unit tests will stay green while the",
              "published server is broken for everyone. That is what this job exists to catch.",
              "",
              "Two assertions deserve particular attention. One checks that a malformed query still",
              "comes back as a refusal rather than as an empty result, which is the rule the whole",
              "server is built on. The other checks that the capture index still pages by the key it",
              "hands back, because it ignores an offset entirely and a cursor that repeats itself",
              "reads as further history.",
            ].join("\n");

            // Reuse the open issue rather than filing one every night.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString()}. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-canary"],
              });
            }
